[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "feed-tuner"
version = "0.1.0"
readme = "README.md"
license = "MIT"
description = "Bounded local browsing of topic searches on X and Threads"
requires-python = ">=3.11"
dependencies = ["playwright>=1.40,<2", "httpx>=0.27,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
feed-tuner = "feed_tuner.cli:main"

[tool.setuptools.packages.find]
include = ["feed_tuner*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
